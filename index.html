<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界の株価ダッシュボード</title>
  <meta name="description" content="世界の主要市場を1画面で見渡せるシンプルな株価ダッシュボード">
  <style>
    :root {
      --bg: #0b1020;
      --bg2: #10182c;
      --panel: rgba(17, 24, 39, 0.88);
      --line: rgba(148, 163, 184, 0.18);
      --text: #edf2ff;
      --muted: #9fb0d1;
      --accent: #5ea1ff;
      --shadow: 0 10px 30px rgba(0,0,0,.28);
      --radius: 16px;
      --gap: 10px;
      --header-h: 58px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top left, rgba(62,120,255,.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(0,213,255,.08), transparent 20%),
        linear-gradient(180deg, var(--bg), #060a15 100%);
      color: var(--text);
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: var(--header-h) 1fr;
    }

    .topbar {
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      gap: var(--gap);
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 12, 24, 0.82);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4d8eff, #3be1ff);
      box-shadow: 0 0 20px rgba(94, 161, 255, .65);
      flex: 0 0 auto;
    }

    .brand-text {
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ticker-shell {
      min-width: 0;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.03);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
    }

    .clockbox {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .clock-pill {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.03);
      color: var(--text);
      font-weight: 600;
      min-width: 124px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: var(--gap);
      padding: var(--gap);
      min-height: 0;
    }

    .panel {
      display: grid;
      grid-template-rows: 46px 1fr;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(20, 29, 50, .92), rgba(11, 17, 31, .92));
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.02), transparent 18%);
      pointer-events: none;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      z-index: 1;
    }

    .panel-title {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel-title strong {
      font-size: 14px;
      letter-spacing: .03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .panel-title span {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .badge {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #dfe8ff;
      background: rgba(94,161,255,.12);
      border: 1px solid rgba(94,161,255,.18);
    }

    .chart {
      min-height: 0;
      height: 100%;
      background: #0b1120;
    }

    .footer-note {
      position: fixed;
      right: 12px;
      bottom: 10px;
      font-size: 11px;
      color: rgba(203,213,225,.72);
      background: rgba(10, 14, 24, 0.7);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    @media (max-width: 1280px) {
      .dashboard {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(220px, 1fr));
        overflow: auto;
      }
      body, html { overflow: auto; }
    }

    @media (max-width: 980px) {
      body {
        grid-template-rows: auto 1fr;
      }
      html, body { overflow: auto; }
      .topbar {
        grid-template-columns: 1fr;
      }
      .clockbox {
        justify-content: flex-start;
        text-align: left;
      }
      .dashboard {
        grid-template-columns: 1fr;
        grid-template-rows: none;
        grid-auto-rows: minmax(300px, 40vh);
      }
      .footer-note {
        position: static;
        margin: 0 10px 10px;
        width: fit-content;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-dot"></div>
      <div class="brand-text">WORLD MARKETS DASHBOARD</div>
    </div>

    <div class="ticker-shell">
      <div class="tradingview-widget-container" style="height:42px;width:100%;">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
          "symbols": [
            {"proName":"FOREXCOM:SPXUSD","title":"S&P 500"},
            {"proName":"NASDAQ:NDX","title":"NASDAQ 100"},
            {"proName":"TVC:NI225","title":"日経225"},
            {"proName":"TVC:UKX","title":"FTSE 100"},
            {"proName":"XETR:DAX","title":"DAX"},
            {"proName":"HSI:HSI","title":"香港ハンセン"},
            {"proName":"FX_IDC:USDJPY","title":"USD/JPY"},
            {"proName":"OANDA:XAUUSD","title":"金"}
          ],
          "showSymbolLogo": false,
          "isTransparent": true,
          "displayMode": "adaptive",
          "colorTheme": "dark",
          "locale": "ja"
        }
        </script>
      </div>
    </div>

    <div class="clockbox">
      <div>
        <div>東京時間</div>
        <div id="clock" class="clock-pill">--:--:--</div>
      </div>
    </div>
  </header>

  <main class="dashboard" id="dashboard"></main>

  <div class="footer-note">PCでは1画面で一覧表示 / モバイルでは縦スクロール表示</div>

  <script>
    const panels = [
      { title: '米国', subtitle: 'S&P 500', symbol: 'FOREXCOM:SPXUSD', label: 'USA' },
      { title: '日本', subtitle: '日経225', symbol: 'TVC:NI225', label: 'JPN' },
      { title: '英国', subtitle: 'FTSE 100', symbol: 'TVC:UKX', label: 'UK' },
      { title: 'ドイツ', subtitle: 'DAX', symbol: 'XETR:DAX', label: 'DEU' },
      { title: 'フランス', subtitle: 'CAC 40', symbol: 'TVC:CAC40', label: 'FRA' },
      { title: '香港', subtitle: 'Hang Seng', symbol: 'HSI:HSI', label: 'HKG' },
      { title: 'インド', subtitle: 'NIFTY 50', symbol: 'NSE:NIFTY', label: 'IND' },
      { title: '豪州', subtitle: 'ASX 200', symbol: 'TVC:AU200', label: 'AUS' }
    ];

    const dashboard = document.getElementById('dashboard');

    panels.forEach((item, index) => {
      const panel = document.createElement('section');
      panel.className = 'panel';
      const widgetId = `tv_chart_${index}`;
      panel.innerHTML = `
        <div class="panel-header">
          <div class="panel-title">
            <strong>${item.title}</strong>
            <span>${item.subtitle}</span>
          </div>
          <div class="badge">${item.label}</div>
        </div>
        <div class="chart">
          <div class="tradingview-widget-container" style="height:100%;width:100%;">
            <div id="${widgetId}" style="height:100%;width:100%;"></div>
          </div>
        </div>
      `;
      dashboard.appendChild(panel);
    });

    const script = document.createElement('script');
    script.src = 'https://s3.tradingview.com/tv.js';
    script.onload = () => {
      panels.forEach((item, index) => {
        new TradingView.widget({
          autosize: true,
          symbol: item.symbol,
          interval: 'D',
          timezone: 'Asia/Tokyo',
          theme: 'dark',
          style: '1',
          locale: 'ja',
          enable_publishing: false,
          hide_side_toolbar: true,
          hide_top_toolbar: true,
          hide_legend: false,
          save_image: false,
          withdateranges: false,
          allow_symbol_change: false,
          details: false,
          hotlist: false,
          calendar: false,
          studies: [],
          container_id: `tv_chart_${index}`
        });
      });
    };
    document.body.appendChild(script);

    function updateClock() {
      const now = new Date();
      const fmt = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('clock').textContent = fmt.format(now);
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
